# Paste into this application's Proxy Host > Advanced in Nginx Proxy Manager.
# Force SSL must also be enabled in the SSL tab.
# NPM's generated location adds its own headers. OpenResty's headers-more module
# applies these headers there as well, including login and error responses.
more_set_headers "X-Content-Type-Options: nosniff";
more_set_headers "X-Frame-Options: DENY";
more_set_headers "Referrer-Policy: same-origin";

# Login cookies cannot authorize responses cached for another visitor.
proxy_cache off;
more_set_headers "Cache-Control: private, no-store";

# Do not retain OAuth callback query strings in request logs.
access_log off;

# At the root, signed-out visitors see the public landing page. A valid gateway
# session continues through the gateway to the account-approved Home page.
location = / {
    auth_request /_dofus_session;
    error_page 401 403 = @dofus_public_home;
    proxy_pass http://dofus-google-login:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /_dofus_session {
    internal;
    proxy_pass http://dofus-google-login:4180/oauth2/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location @dofus_public_home {
    proxy_pass http://dofus-public-pages:8080;
    proxy_set_header Host $host;
}

# Public pages contain no database records or credentials. All other paths use
# this Proxy Host's normal authenticated upstream.
location = /about {
    proxy_pass http://dofus-public-pages:8080;
    proxy_set_header Host $host;
}
location = /privacy {
    proxy_pass http://dofus-public-pages:8080;
    proxy_set_header Host $host;
}
location = /public.css {
    proxy_pass http://dofus-public-pages:8080;
    proxy_set_header Host $host;
}
# This shared appearance script contains no account data or application access.
location = /theme.js {
    proxy_pass http://dofus-public-pages:8080;
    proxy_set_header Host $host;
}
