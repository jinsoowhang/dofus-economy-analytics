name: dofus-economy

services:
  public_pages:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine
    restart: unless-stopped
    user: "101:101"
    entrypoint: [nginx]
    command: [-c, /etc/nginx/nginx.conf, -g, "daemon off;"]
    volumes:
      - ./public/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
    networks:
      proxy:
        aliases:
          - dofus-public-pages
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/about]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${DOFUS_PROXY_NETWORK:?Set the existing reverse proxy network}
